<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Mini App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles/fonts/TTCommons/import-tt-commons.css">
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="app-container">
        <form class="registration-form" action="/api/sendInitials" method="POST">
            <h1>Представьтесь, пожалуйста</h1>
            <div class="form-group">
                <label for="surname">Фамилия:</label>
                <input type="text" name="surname" class="form-control" placeholder="Гетманов">
                <label for="surname">Имя:</label>
                <input type="text" name="name" class="form-control" placeholder="Николай">
                <label for="surname">Отчество:</label>
                <input type="text" name="patronymic" class="form-control" placeholder="Николаевич">
            </div>
            <button type="submit" class="btn btn-primary">Подтвердить</button>
        </form>
    </div>
</body>
</html>
